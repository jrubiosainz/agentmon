name: Deploy to Azure Web App

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build client + server
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Prune to production dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Assemble deployment package
        run: |
          set -euo pipefail
          mkdir -p deploy
          cp package.json deploy/
          mkdir -p deploy/server
          cp server/package.json deploy/server/
          cp -r server/dist deploy/server/dist
          mkdir -p deploy/client
          cp -r client/dist deploy/client/dist
          cp -r node_modules deploy/node_modules
          cd deploy
          zip -r ../release.zip . -x '*.map'

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
