<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#101018" />
    <meta name="description" content="Agentmon - collect, train and battle robot creatures in a retro handheld RPG." />
    <title>Agéntmon</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23101018'/><rect x='3' y='4' width='10' height='7' fill='%2358c8f0'/><rect x='5' y='6' width='2' height='2' fill='%23101018'/><rect x='9' y='6' width='2' height='2' fill='%23101018'/></svg>" />
  </head>
  <body>
    <div id="app">
      <div id="screen-frame">
        <canvas id="screen" width="240" height="160"></canvas>
        <div id="overlay"></div>
      </div>
      <button id="sound-toggle" type="button" aria-pressed="true" aria-label="Sound on">
        <span class="ico" aria-hidden="true">&#9835;</span><span class="lbl">SOUND ON</span>
      </button>
      <div id="touch-controls" hidden>
        <div class="dpad">
          <button class="btn" data-btn="up" aria-label="Up"></button>
          <button class="btn" data-btn="left" aria-label="Left"></button>
          <button class="btn" data-btn="right" aria-label="Right"></button>
          <button class="btn" data-btn="down" aria-label="Down"></button>
        </div>
        <div class="actions">
          <button class="btn round" data-btn="b">B</button>
          <button class="btn round" data-btn="a">A</button>
        </div>
        <div class="system">
          <button class="btn pill" data-btn="select">SELECT</button>
          <button class="btn pill" data-btn="start">START</button>
        </div>
      </div>
      <p id="hint">
        Arrows / WASD move &nbsp;·&nbsp; <b>Z</b> or <b>Enter</b> = A &nbsp;·&nbsp; <b>X</b> or <b>Esc</b> = B
        &nbsp;·&nbsp; <b>Shift</b> = START &nbsp;·&nbsp; <b>Tab</b> = SELECT
      </p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
